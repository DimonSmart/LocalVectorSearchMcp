name: Temporary markdown feature formatter
on:
  push:
    branches:
      - feat/markdown-list-item-blockquote-semantics
permissions:
  contents: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/markdown-list-item-blockquote-semantics
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DimonSmart.LocalVectorSearchMcp.sln
      - run: dotnet format DimonSmart.LocalVectorSearchMcp.sln --no-restore
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/feature-format.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format Markdown semantic editing implementation"
            git push origin HEAD:feat/markdown-list-item-blockquote-semantics
          fi
      - run: dotnet build DimonSmart.LocalVectorSearchMcp.sln --configuration Release --no-restore
      - run: dotnet test DimonSmart.LocalVectorSearchMcp.sln --configuration Release --no-build
