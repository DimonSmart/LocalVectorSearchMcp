name: Publish MCP Registry metadata

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already published NuGet package version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Retry Registry publication without rebuilding NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate, publish and verify
        shell: bash
        run: bash scripts/publish-mcp-registry.sh "${{ inputs.version }}"
