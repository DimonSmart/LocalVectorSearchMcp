name: Format table feature branch

on:
  push:
    branches:
      - feat/semantic-markdown-tables

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DimonSmart.LocalVectorSearchMcp.sln
      - name: Apply repository formatting
        run: dotnet format DimonSmart.LocalVectorSearchMcp.sln --no-restore
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --staged --quiet; then
            git commit -m "style: apply dotnet format to semantic table feature"
            git push origin HEAD:refs/heads/feat/semantic-markdown-tables
          fi
      - name: Build
        run: dotnet build DimonSmart.LocalVectorSearchMcp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DimonSmart.LocalVectorSearchMcp.sln --configuration Release --no-build
